    <style>
        html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; }
        body {
            background: linear-gradient(135deg, #1F531C 0%, #652224 100%);

            padding: 40px 20px;
            box-sizing: border-box;

        .card {

        li { margin-bottom: 8px; }
        
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .music-item {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .music-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
